# What mosh-sylph needs on top of the QIIME 2 "tiny" distribution's released
# 2026.10 environment (https://library.qiime2.org/quickstart/tiny): sylph,
# and the test and lint tools. Applied with
# `conda env update -n rachis-tiny-2026.10 --file <this file>`, then
# `make dev`. The same file layers the plugin onto the qiime2 or moshpit
# distribution's environment; CI tests tiny and qiime2 this way
# (.github/workflows/ci.yml). 2026-10-28: the base moved from the
# distribution's dev/latest/passed file to the release.
channels:
- conda-forge
- bioconda
dependencies:
  - sylph=1.0.0
  - pytest
  - flake8
  - pip
  - pip:
    - q2lint@https://github.com/qiime2/q2lint/archive/master.zip
