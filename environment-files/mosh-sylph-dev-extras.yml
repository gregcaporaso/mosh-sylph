# What mosh-sylph needs on top of the QIIME 2 "tiny" distribution's development
# environment: sylph and sylph-tax, and the test and lint tools. The base
# environment comes from the distribution's dev/latest/passed environment file,
# as in https://develop.qiime2.org/en/stable/plugins/how-to-guides/set-up-development-environment.html;
# this file is applied to it with `conda env update` (README, "Development
# installation"). The same file layers the plugin onto the moshpit or qiime2
# distribution's development environment. 2026-10-16: replaced the
# metapackage-based file (2026.10 is unreleased).
channels:
- conda-forge
- bioconda
dependencies:
  - sylph=1.0.0
  - sylph-tax=1.9.2
  - pytest
  - flake8
  - pip
  - pip:
    - q2lint@https://github.com/qiime2/q2lint/archive/master.zip
